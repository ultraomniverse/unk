<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030303">
<title>YouTube Music</title>
<style>
:root{
  --bg:#030303; --surface:#212121; --surface2:#2a2a2a; --hover:#1f1f1f;
  --text:#fff; --text2:#aaa; --text3:#717171; --line:#272727;
  --red:#ff0000; --blue:#3ea6ff; --chip:#212121; --chip-on:#fff;
  --h-top:64px; --h-bar:90px; --w-side:240px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:Roboto,"Helvetica Neue",Arial,sans-serif;font-size:14px;padding-bottom:var(--h-bar)}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
img{display:block}a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#3d3d3d;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

.top{position:sticky;top:0;z-index:60;height:var(--h-top);display:flex;align-items:center;gap:8px;padding:0 16px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:5px;cursor:pointer;flex:0 0 auto;margin-right:10px}
.brand .mark{width:30px;height:30px;border-radius:50%;background:var(--red);display:grid;place-items:center}
.brand .mark svg{fill:#fff;margin-left:1px}
.brand b{font-size:19px;font-weight:400;letter-spacing:-.5px;white-space:nowrap}
.brand b i{font-style:normal;font-weight:500}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--text2);flex:0 0 auto}
.iconbtn:hover{background:var(--hover);color:var(--text)}
.searchbox{flex:1;max-width:720px;display:flex;align-items:center;gap:8px;background:var(--surface);
  border-radius:8px;height:40px;padding:0 6px 0 14px;border:1px solid transparent}
.searchbox:focus-within{border-color:var(--blue);background:#0f0f0f}
.searchbox input{flex:1;background:none;border:0;outline:none;color:var(--text);font-size:15px}
.searchbox input::placeholder{color:var(--text3)}
.searchbox .clear{width:28px;height:28px;border-radius:50%;display:none;place-items:center;color:var(--text2)}
.searchbox .clear.show{display:grid}
.right-top{margin-left:auto;display:flex;align-items:center;gap:4px}
.avatar{width:32px;height:32px;border-radius:50%;background:#8e24aa;display:grid;place-items:center;font-size:14px;font-weight:500;margin-left:4px}

.wrap{display:flex;min-height:calc(100vh - var(--h-top))}
.side{width:var(--w-side);flex:0 0 auto;padding:6px 12px 24px;position:sticky;top:var(--h-top);
  align-self:flex-start;height:calc(100vh - var(--h-top));overflow-y:auto}
.side .it{display:flex;align-items:center;gap:22px;height:40px;padding:0 12px;border-radius:8px;color:var(--text);font-size:14px}
.side .it svg{flex:0 0 auto;fill:var(--text)}
.side .it:hover{background:var(--hover)}
.side .it.on{background:var(--surface);font-weight:500}
.side hr{border:0;border-top:1px solid var(--line);margin:10px 0}
.side .cap{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;font-size:15px;font-weight:500;color:var(--text2)}
.side .cap button{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--text2)}
.side .cap button:hover{background:var(--hover);color:var(--text)}
.plrow{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:8px;font-size:13.5px;color:var(--text2);cursor:pointer}
.plrow:hover{background:var(--hover);color:var(--text)}
.plrow .ph{width:26px;height:26px;border-radius:4px;background:var(--surface2);flex:0 0 auto;overflow:hidden}
.plrow .ph img{width:100%;height:100%;object-fit:cover}
.plrow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.main{flex:1;min-width:0;padding:0 0 24px}

.chips{display:flex;gap:8px;padding:8px 16px 12px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:0 12px;height:32px;border-radius:8px;background:var(--chip);color:var(--text);font-size:14px;white-space:nowrap;display:inline-flex;align-items:center}
.chip:hover{background:#2f2f2f}
.chip.on{background:var(--chip-on);color:#030303}
.sec{padding:0 16px;margin-bottom:28px}
.sechead{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.sechead h2{font-size:20px;font-weight:500;margin:0}
.sechead .more{font-size:13px;color:var(--text2)}
.sechead .more:hover{color:var(--text)}
.rail{display:flex;gap:16px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail>*{flex:0 0 168px}
@media(min-width:1400px){.rail>*{flex:0 0 190px}}

.card{cursor:pointer;border-radius:8px;position:relative;padding:8px;margin:-8px}
.card:hover{background:var(--hover)}
.card .art{position:relative;width:100%;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--surface2)}
.card .art img{width:100%;height:100%;object-fit:cover}
.card .art.round{border-radius:50%}
.card .play{position:absolute;right:8px;bottom:8px;width:48px;height:48px;border-radius:50%;background:var(--text);color:#030303;
  display:grid;place-items:center;opacity:0;transform:translateY(6px);transition:.15s;box-shadow:0 4px 12px rgba(0,0,0,.5)}
.card:hover .play{opacity:1;transform:none}
.card .play:hover{transform:scale(1.06)}
.card .t{font-size:14px;margin-top:10px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .s{font-size:13px;color:var(--text2);margin-top:2px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.qp{display:grid;grid-template-columns:repeat(4,1fr);gap:2px 12px}
.qp .qi{display:flex;align-items:center;gap:12px;padding:8px;border-radius:8px;cursor:pointer;min-width:0}
.qp .qi:hover{background:var(--hover)}
.qp .qi .ph{width:56px;height:56px;border-radius:4px;overflow:hidden;flex:0 0 auto;position:relative;background:var(--surface2)}
.qp .qi .ph img{width:100%;height:100%;object-fit:cover}
.qp .qi .m{min-width:0}
.qp .qi .m b{display:block;font-size:14px;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qp .qi .m small{display:block;font-size:13px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.qp .qi .ov{position:absolute;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;opacity:0}
.qp .qi:hover .ov{opacity:1}

.rows{padding:0 4px}
.row{display:grid;grid-template-columns:28px 48px 1fr auto 96px;gap:12px;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer}
.row:hover{background:var(--hover)}
.row.on .ttl{color:var(--blue)}
.row .n{font-size:13px;color:var(--text2);text-align:right;font-variant-numeric:tabular-nums}
.row .ph{width:48px;height:48px;border-radius:4px;overflow:hidden;background:var(--surface2)}
.row .ph img{width:100%;height:100%;object-fit:cover}
.row .m{min-width:0}
.row .ttl{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{font-size:13px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.row .d{font-size:13px;color:var(--text2);font-variant-numeric:tabular-nums}
.row .acts{display:flex;gap:2px;justify-content:flex-end;opacity:0}
.row:hover .acts{opacity:1}
.row .acts button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--text2)}
.row .acts button:hover{background:#3f3f3f;color:var(--text)}
.badge-e{display:inline-grid;place-items:center;width:15px;height:15px;background:var(--text2);color:#030303;border-radius:2px;font-size:9px;font-weight:700;vertical-align:1px;margin-left:6px}

.hd{display:flex;gap:24px;padding:24px 16px 20px;align-items:flex-end}
.hd .art{width:200px;height:200px;border-radius:8px;overflow:hidden;flex:0 0 auto;background:var(--surface2)}
.hd .art.round{border-radius:50%}
.hd .art img{width:100%;height:100%;object-fit:cover}
.hd .k{font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:.6px}
.hd h1{font-size:clamp(28px,5vw,52px);font-weight:700;margin:6px 0 8px;letter-spacing:-1px;line-height:1.05}
.hd .meta{font-size:13px;color:var(--text2);line-height:1.5;max-height:60px;overflow:hidden}
.hdacts{display:flex;align-items:center;gap:14px;padding:16px 16px 8px}
.bigplay{width:56px;height:56px;border-radius:50%;background:var(--text);color:#030303;display:grid;place-items:center}
.bigplay:hover{transform:scale(1.05)}
.pill{border:1px solid #4d4d4d;border-radius:18px;height:36px;padding:0 16px;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.pill:hover{background:var(--hover)}

.bar{position:fixed;left:0;right:0;bottom:0;height:var(--h-bar);z-index:70;
  display:grid;grid-template-columns:minmax(180px,1fr) auto minmax(180px,1fr);
  align-items:center;gap:16px;padding:0 16px;background:var(--bg);border-top:1px solid #1a1a1a}
.now{display:flex;align-items:center;gap:12px;min-width:0}
.now .ph{width:56px;height:56px;border-radius:4px;overflow:hidden;flex:0 0 auto;background:var(--surface2);cursor:pointer}
.now .ph img{width:100%;height:100%;object-fit:cover}
.now .m{min-width:0}
.now .m b{display:block;font-size:14px;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.now .m small{display:block;font-size:12px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.ctrls{display:flex;flex-direction:column;align-items:center;gap:6px;width:min(42vw,540px)}
.cbtns{display:flex;align-items:center;gap:8px}
.cbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--text2);position:relative}
.cbtn:hover{background:var(--hover);color:var(--text)}
.cbtn.on{color:var(--blue)}
.cbtn.main{width:48px;height:48px;background:var(--text);color:#030303}
.cbtn.main:hover{background:#e8e8e8}
.cbtn.main svg{fill:#030303}
.prog{display:flex;align-items:center;gap:10px;width:100%;font-size:11px;color:var(--text2);font-variant-numeric:tabular-nums}
.track{flex:1;height:14px;display:flex;align-items:center;cursor:pointer}
.track .in{height:4px;width:100%;background:#4d4d4d;border-radius:2px;position:relative}
.track .in i{position:absolute;inset:0 auto 0 0;width:0;background:var(--text);border-radius:2px}
.track:hover .in i{background:var(--red)}
.rbtns{display:flex;align-items:center;justify-content:flex-end;gap:2px}
.rbtns input{width:80px;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:#4d4d4d;outline:none}
.rbtns input::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff}

.panel{position:fixed;top:0;right:0;bottom:var(--h-bar);width:min(420px,100vw);z-index:80;
  background:var(--bg);border-left:1px solid #1a1a1a;display:none;flex-direction:column}
.panel.open{display:flex}
.panel .ph2{display:flex;align-items:center;gap:8px;padding:10px 8px 10px 16px;border-bottom:1px solid #1a1a1a}
.panel .ph2 h3{font-size:16px;font-weight:500;margin:0;flex:1}
.panel .body{overflow-y:auto;padding:8px;flex:1}
.panel .lyr{padding:20px 22px;font-size:17px;line-height:1.9;white-space:pre-wrap;color:#e6e6e6}

.menu{position:fixed;z-index:120;min-width:230px;background:#282828;border-radius:8px;padding:8px 0;
  box-shadow:0 6px 24px rgba(0,0,0,.6);display:none}
.menu.open{display:block}
.menu button{display:flex;align-items:center;gap:14px;width:100%;padding:10px 18px;font-size:14px;text-align:left}
.menu button:hover{background:#3f3f3f}

.tabbar{display:none}
@media(max-width:900px){
  :root{--h-bar:72px}
  .side{display:none}
  .brand b{display:none}
  .searchbox{max-width:none}
  .qp{grid-template-columns:1fr}
  .rail>*{flex:0 0 140px}
  .hd{flex-direction:column;align-items:center;text-align:center;padding:16px}
  .hd .art{width:190px;height:190px}
  .row{grid-template-columns:24px 44px 1fr auto}
  .row .acts{display:none}
  .rbtns input{display:none}
  .bar{grid-template-columns:1fr auto;gap:10px;padding:0 12px;bottom:56px;border-top:0}
  .ctrls{width:auto;flex-direction:row}
  .prog{position:absolute;left:0;right:0;top:-2px;padding:0;gap:0}
  .prog span{display:none}
  .cbtns .opt{display:none}
  body{padding-bottom:calc(var(--h-bar) + 56px)}
  .tabbar{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;left:0;right:0;bottom:0;
    height:56px;background:var(--bg);border-top:1px solid #1a1a1a;z-index:75}
  .tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text2);font-size:10px}
  .tabbar button.on{color:var(--text)}
  .tabbar svg{fill:currentColor}
  .panel{bottom:calc(var(--h-bar) + 56px)}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand" onclick="location.hash='#/'">
    <span class="mark"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>
    <b>YouTube <i>Music</i></b>
  </div>
  <div class="searchbox">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="#717171"><path d="M20.87 20.17l-5.59-5.59A6.95 6.95 0 0 0 16 10a6 6 0 1 0-6 6 6.95 6.95 0 0 0 4.58-1.72l5.59 5.59.7-.7zM4 10a5 5 0 1 1 5 5 5 5 0 0 1-5-5z"/></svg>
    <input id="q" placeholder="Buscar" autocomplete="off" spellcheck="false">
    <button class="clear" id="qClear"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12.7 12l5.6 5.6-.7.7-5.6-5.6L6.4 18.3l-.7-.7 5.6-5.6-5.6-5.6.7-.7 5.6 5.6 5.6-5.6.7.7z"/></svg></button>
  </div>
  <div class="right-top">
    <button class="iconbtn" id="btnNet" title="Estado"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 20a1.6 1.6 0 1 0 0-3.2 1.6 1.6 0 0 0 0 3.2zm-4.2-4.4a6 6 0 0 1 8.4 0l1.4-1.4a8 8 0 0 0-11.2 0zM4.4 12.2a11 11 0 0 1 15.2 0L21 10.8a13 13 0 0 0-18 0z"/></svg></button>
    <div class="avatar">P</div>
  </div>
</header>

<div class="wrap">
  <nav class="side" id="side">
    <a class="it" href="#/"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M4 10v10h5v-6h6v6h5V10L12 3z"/></svg>Inicio</a>
    <a class="it" href="#/explore"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8zm3.5-11.5L10 10l-1.5 5.5L14 14z"/></svg>Explorar</a>
    <a class="it" href="#/library"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M4 4h4v16H4zM10 4h4v16h-4zM17 4l3 16h-2L15 4z"/></svg>Biblioteca</a>
    <hr>
    <div class="cap">Listas <button id="newPl"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4h1v7h7v1h-7v7h-1v-7H5v-1h7z"/></svg></button></div>
    <div id="plList"></div>
    <hr>
    <div class="cap">Historial</div>
    <div id="histList"></div>
  </nav>
  <main class="main" id="view"></main>
</div>

<div class="tabbar" id="tabbar">
  <button data-go="#/" class="on"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M4 10v10h5v-6h6v6h5V10L12 3z"/></svg>Inicio</button>
  <button data-go="#/explore"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8zm3.5-11.5L10 10l-1.5 5.5L14 14z"/></svg>Explorar</button>
  <button data-go="#/library"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M4 4h4v16H4zM10 4h4v16h-4zM17 4l3 16h-2L15 4z"/></svg>Biblioteca</button>
</div>

<div class="bar">
  <div class="now">
    <div class="ph" id="npArt"></div>
    <div class="m"><b id="npTitle">Nada sonando</b><small id="npArtist">—</small></div>
    <button class="cbtn" id="cLike" title="Me gusta" style="margin-left:4px"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M2 10h3v11H2zm20 .5c0-1-.8-1.5-1.8-1.5h-5.4l.8-4c.1-.6-.2-1.2-.7-1.4L14 3l-5.4 6.3V21h11.6c.8 0 1.5-.5 1.7-1.3l2-7c.1-.4.1-.8.1-1.2z"/></svg></button>
  </div>
  <div class="ctrls">
    <div class="cbtns">
      <button class="cbtn opt" id="cShuf" title="Aleatorio"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16 3h5v5l-2-2-3.3 3.3-1.4-1.4L17.6 4.6zM4 6h3.5l2.6 3.2-1.4 1.4L6.5 8H4zm0 10h3.5l7-8.4 1.4 1.4L8.6 18H4zm12 5l-1.4-1.4 3.3-3.3 1.4 1.4zM19 14l2-2v5h-5l2-2z"/></svg></button>
      <button class="cbtn" id="cPrev"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button class="cbtn main" id="cPlay"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="cbtn" id="cNext"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5l11 7-11 7z"/></svg></button>
      <button class="cbtn opt" id="cRep" title="Repetir"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h12v4l3-3.5L18 3v2H4v6h2zM18 18H6v-4l-3 3.5L6 21v-2h14v-6h-2z"/></svg></button>
    </div>
    <div class="prog"><span id="tCur">0:00</span><div class="track" id="track"><div class="in"><i id="fill"></i></div></div><span id="tDur">0:00</span></div>
  </div>
  <div class="rbtns">
    <button class="cbtn" id="cLyrics" title="Letra"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M4 6h16v2H4zm0 5h11v2H4zm0 5h16v2H4z"/></svg></button>
    <button class="cbtn" id="cQueue" title="A continuación"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h10v2H4z"/></svg></button>
    <button class="cbtn" id="cVol"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9z"/></svg></button>
    <input type="range" id="vol" min="0" max="100" value="100">
  </div>
</div>

<div class="panel" id="panel">
  <div class="ph2"><h3 id="panelTitle">A continuación</h3><button class="iconbtn" id="panelClose"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12.7 12l5.6 5.6-.7.7-5.6-5.6L6.4 18.3l-.7-.7 5.6-5.6-5.6-5.6.7-.7 5.6 5.6 5.6-5.6.7.7z"/></svg></button></div>
  <div class="body" id="panelBody"></div>
</div>

<div class="menu" id="menu"></div>

<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>{s=Math.max(0,~~s);const h=~~(s/3600),m=~~(s%3600/60),x=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0');};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function toast(t){
  let el=$('#toast');
  if(!el){el=document.createElement('div');el.id='toast';
    el.style.cssText='position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:#fff;color:#030303;padding:10px 18px;border-radius:6px;font-size:13px;z-index:200;box-shadow:0 4px 16px rgba(0,0,0,.5);max-width:80vw';
    document.body.appendChild(el);}

const POSTPROXIES=[

},extra));

let directOK=true, netState='ok';
function setNet(s){netState=s;const b=$('#btnNet');b.style.color=s==='ok'?'':(s==='warn'?'#eab308':'#ff5252');}

async function innertube(ep,body){
  const url=YT+ep+'?alt=json&key='+KEY+'&prettyPrint=false';
  const payload=ctxBody(body);
  const headers={'content-type':'application/json','user-agent':UA,origin:'https://music.youtube.com','x-youtube-client-name':'67'};
  if(directOK){
    try{
      const r=await fetch(url,{method:'POST',headers,body:payload});
      if(r.ok){setNet('ok');return r.json();}
      if(r.status===403||r.status===400) throw new Error('direct '+r.status);
    }catch(e){ directOK=false; }
  }
  for(const px of POSTPROXIES){
    try{
      const r=await fetch(px(url),{method:'POST',headers,body:payload});
      if(!r.ok) continue;
      setNet('warn');
      return await r.json();
    }catch{}
  }
  setNet('bad');
  throw new Error('sin ruta de red');
}

const toSec=t=>{const p=String(t||'').split(':').map(Number);return p.some(isNaN)?0:p.reduce((a,b)=>a*60+b,0)};

function parseItem(r){
  if(!r) return null;
  const col=r.flexColumns||[];
  const title=txt(nav(col[0],'musicResponsiveListItemFlexColumnRenderer.text'))||txt(r.title);
  if(!title) return null;
  const sub=nav(col[1],'musicResponsiveListItemFlexColumnRenderer.text.runs')||[];
  const artists=[],badges=[];let album=null,dur='';
  sub.forEach((run,i)=>{
    const ep=run.navigationEndpoint;
    if(ep?.browseEndpoint?.browseId?.startsWith('UC')) artists.push({name:run.text,id:ep.browseEndpoint.browseId});
    else if(ep?.browseEndpoint?.browseId?.startsWith('MPRE')) album={name:run.text,id:ep.browseEndpoint.browseId};
    else if(/^\d+:\d+/.test(run.text)) dur=run.text;
    else if(i>0&&run.text&&!artists.length&&!album&&run.text.length>1&&!/^\d/.test(run.text)) artists.push({name:run.text,id:null});
  });
  (r.badges||[]).forEach(b=>{if(/explícit/i.test(txt(nav(b,'musicInlineBadgeRenderer.accessibilityData.label'))))badges.push('E')});
  const vid=nav(r,'playButton.buttonRenderer.playNavigationEndpoint.watchEndpoint.videoId')||
            nav(r,'overlay.musicItemThumbnailOverlayRenderer.content.musicPlayButtonRenderer.playNavigationEndpoint.watchEndpoint.videoId')||
            nav(r,'navigationEndpoint.watchEndpoint.videoId');
  return {
    videoId:vid||null,
    browseId:nav(r,'navigationEndpoint.browseEndpoint.browseId')||null,
    title, artists, artist:artists.map(a=>a.name).join(', '), album,
    duration:dur, seconds:toSec(dur), explicit:badges.length>0,
    thumb:thumb(nav(r,'thumbnail.musicThumbnailRenderer.thumbnail.thumbnails')),
    subtitle:sub.map(x=>x.text).join('').trim()
  };
}
function parseCard(r){
  const t=nav(r,'title'); if(!t) return null;
  const id=nav(r,'navigationEndpoint.browseEndpoint.browseId')||nav(r,'navigationEndpoint.watchEndpoint.videoId')||null;
  const isArtist=String(id||'').startsWith('UC');
  return {
    type:isArtist?'artist':'card',
    browseId:isArtist?id:null,
    videoId:isArtist?null:(nav(r,'navigationEndpoint.watchEndpoint.videoId')||null),
    title:txt(t), subtitle:(nav(r,'subtitle.runs')||[]).map(x=>x.text).join(''),
    thumb:thumb(nav(r,'thumbnailRenderer.musicThumbnailRenderer.thumbnail.thumbnails')),
    round:isArtist
  };
}
function parseShelf(s){
  const r=s.musicCarouselShelfRenderer||s.musicShelfRenderer; if(!r) return null;
  const title=txt(nav(r,'header.musicCarouselShelfBasicHeaderRenderer.title'))||txt(r.title);
  const more=nav(r,'header.musicCarouselShelfBasicHeaderRenderer.moreContentButton.buttonRenderer.navigationEndpoint.browseEndpoint.browseId');
  const items=(r.contents||[]).map(c=>c.musicResponsiveListItemRenderer?parseItem(c.musicResponsiveListItemRenderer)
    :c.musicTwoRowItemRenderer?parseCard(c.musicTwoRowItemRenderer):null).filter(Boolean);
  if(!items.length) return null;
  const layout=r.contents?.[0]?.musicResponsiveListItemRenderer?'list':(r.numColumns===1?'row1':'grid');
  return {title,more:more||null,layout,items};
}
function parseSections(json){
  const out=[];
  (function walk(n){
    if(!n||typeof n!=='object')return;
    if(Array.isArray(n))return n.forEach(walk);
    if(n.musicCarouselShelfRenderer||n.musicShelfRenderer){const s=parseShelf(n);if(s)out.push(s);return;}
    Object.values(n).forEach(walk);
  })(json);
  return out;
}

const media=$('#media');

async function resolve(videoId,mode){
  const j=await innertube('player',{videoId,
    playbackContext:{contentPlaybackContext:{html5Preference:'HTML5_PREF_WANTS'}},
    contentCheckOk:true,racyCheckOk:true});
  const st=j.streamingData; if(!st) throw new Error('sin streamingData');
  let pick=null;
  if(mode==='video'){
    const prog=(st.formats||[]).filter(f=>/^video\/mp4/.test(f.mimeType));
    pick=prog.sort((a,b)=>(a.bitrate||0)-(b.bitrate||0))[0]||null;
    if(!pick){
      const v=(st.adaptiveFormats||[]).filter(f=>/^video\/mp4/.test(f.mimeType))
        .sort((a,b)=>(a.bitrate||0)-(b.bitrate||0))[0];
      pick=v||null;
    }
  }else{
    const aud=(st.adaptiveFormats||[]).filter(f=>/^audio\//.test(f.mimeType))
      .sort((a,b)=>(a.bitrate||0)-(b.bitrate||0));
    pick=aud[0]||null;
  }
  if(!pick) throw new Error('sin formato');
  return {url:pick.url,mime:pick.mimeType,length:Number(j.videoDetails?.lengthSeconds||0)};
}

let token=0;
async function play(t,queue,index){
  if(!t||!t.videoId) return;
  if(queue){S.queue=queue.slice();S.qi=index;}
  S.cur=t;
  S.hist.unshift({...t,ts:Date.now()});S.hist=S.hist.slice(0,60);
  paintNow();renderPanel();renderSide();save();ms(t);
  const my=++token;
  try{
    const r=await resolve(t.videoId,S.vid?'video':'audio');
    if(my!==token) return;
    S.proxy=-1;
    media.src=MEDIAPROXIES[0](r.url);
    S.rawUrl=r.url;
    media.play().catch(()=>{});
  }catch(e){ if(my===token) toast('No se pudo reproducir'); }
}
media.addEventListener('error',()=>{
  if(!S.cur||!S.rawUrl) return;
  S.proxy++;
  if(S.proxy>=MEDIAPROXIES.length){toast('Fuentes agotadas');return;}
  const at=media.currentTime;
  media.src=MEDIAPROXIES[S.proxy](S.rawUrl);
  media.addEventListener('loadedmetadata',()=>{if(at>1)media.currentTime=at},{once:true});
  media.play().catch(()=>{});
});

function next(){
  if(S.repeat==='one'){media.currentTime=0;media.play();return;}
  if(S.shuffle&&S.queue.length>1){let r;do{r=~~(Math.random()*S.queue.length)}while(r===S.qi);return play(S.queue[r],null,r);}
  if(S.qi+1<S.queue.length) return play(S.queue[S.qi+1],null,S.qi+1);
  if(S.repeat==='all'&&S.queue.length) return play(S.queue[0],null,0);
}
function prev(){if(media.currentTime>3){media.currentTime=0;return;}if(S.qi>0)play(S.queue[S.qi-1],null,S.qi-1);}
function toggle(){if(!S.cur){if(S.queue.length)play(S.queue[0],null,0);return;}media.paused?media.play():media.pause();}

media.addEventListener('timeupdate',()=>{
  const d=media.duration||0;
  $('#fill').style.width=(d?Math.min(100,media.currentTime/d*100):0)+'%';
  $('#tCur').textContent=fmt(media.currentTime);
  if(d&&isFinite(d))$('#tDur').textContent=fmt(d);
});
media.addEventListener('play',()=>{S.playing=true;paintPlay();});
media.addEventListener('pause',()=>{S.playing=false;paintPlay();});
media.addEventListener('ended',next);

function ms(t){
  if(!('mediaSession' in navigator))return;
  try{
    navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist,
      artwork:t.thumb?[{src:t.thumb,sizes:'512x512',type:'image/jpeg'}]:[]});
    navigator.mediaSession.setActionHandler('play',()=>media.play());
    navigator.mediaSession.setActionHandler('pause',()=>media.pause());
    navigator.mediaSession.setActionHandler('nexttrack',next);
    navigator.mediaSession.setActionHandler('previoustrack',prev);
  }catch{}
}

    <h2 style="font-size:22px;margin-bottom:10px">No se pudo cargar</h2>
    <p style="color:#aaa;line-height:1.7">${esc(e?.message||'La red no respondió')}. Los proxies públicos se saturan; recarga o espera un minuto.</p>
    <p style="color:#aaa;line-height:1.7;margin-top:10px">Estado: ${netState==='ok'?'directo':'proxies'}${directOK?'':' (directo bloqueado)'}</p>
    <button class="pill" onclick="location.reload()" style="margin-top:14px">Reintentar</button></div>`;
}

/* ============ router ============ */
function route(){
  const raw=location.hash.replace(/^#\/?/,'');
  const [seg,...rest]=raw.split('/');
  const arg=rest.map(decodeURIComponent).join('/');
  $$('.tabbar button').forEach(b=>b.classList.toggle('on',(b.dataset.go||'#/').slice(2)===seg));
  $$('.side .it').forEach(a=>a.classList.toggle('on',a.getAttribute('href').slice(2)===seg));
  window.scrollTo(0,0);
  if(!seg||seg==='home') home();
  else if(seg==='explore') explore();
  else if(seg==='library') library();
  else if(seg==='likes') likes();
  else if(seg==='history') history();
  else if(seg==='search') search(arg);
  else if(seg==='browse') browse(arg);
  else if(seg==='watch') watch(arg);
  else if(seg==='playlist') playlist(arg);
  else home();
  renderSide(); renderPanel();
}
addEventListener('hashchange',route);

function renderSide(){
  $('#plList').innerHTML=S.lists.map(l=>`<div class="plrow" data-pl="${esc(l.id)}"><div class="ph">${l.items[0]?.thumb?`<img src="${esc(l.items[0].thumb)}">`:''}</div><span>${esc(l.name)}</span></div>`).join('');
  $('#histList').innerHTML=S.hist.slice(0,6).map(h=>`<div class="plrow" data-h="${esc(h.videoId||'')}"><div class="ph">${h.thumb?`<img src="${esc(h.thumb)}">`:''}</div><span>${esc(h.title)}</span></div>`).join('');
}
function likes(){
  view.innerHTML=`<div class="hd"><div class="art">${S.likes[0]?.thumb?`<img src="${esc(S.likes[0].thumb)}">`:''}</div>
    <div><div class="k">Lista</div><h1>Me gusta</h1><div class="meta">${S.likes.length} canciones</div></div></div>
    <div class="hdacts"><button class="bigplay" id="lkPlay"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button></div>
    <div class="sec"><div class="rows">${S.likes.map((x,i)=>rowHTML(x,i,'lk')).join('')||'<p style="color:#aaa">Nada todavía.</p>'}</div></div>`;
  $('#lkPlay').onclick=()=>S.likes[0]&&play(S.likes[0],S.likes,0);
  CTX.lk=S.likes;
}
function history(){
  view.innerHTML=`<div class="hd"><div><div class="k">Tu colección</div><h1>Historial</h1></div></div>
    <div class="sec"><div class="rows">${S.hist.map((x,i)=>rowHTML(x,i,'hs')).join('')||'<p style="color:#aaa">Sin historial.</p>'}</div></div>`;
  CTX.hs=S.hist;
}
function playlist(id){
  const l=S.lists.find(x=>x.id===id); if(!l) return home();
  view.innerHTML=`<div class="hd"><div class="art">${l.items[0]?.thumb?`<img src="${esc(l.items[0].thumb)}">`:''}</div>
    <div><div class="k">Lista</div><h1>${esc(l.name)}</h1><div class="meta">${l.items.length} canciones</div></div></div>
    <div class="hdacts"><button class="bigplay" id="plPlay"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button></div>
    <div class="sec"><div class="rows">${l.items.map((x,i)=>rowHTML(x,i,'pl')).join('')||'<p style="color:#aaa">Lista vacía.</p>'}</div></div>`;
  $('#plPlay').onclick=()=>l.items[0]&&play(l.items[0],l.items,0);
  CTX.pl=l.items;
}

/* ============ panel ============ */
let panelMode='queue';
function renderPanel(){
  if(!$('#panel').classList.contains('open'))return;
  if(panelMode!=='queue')return;
  $('#panelTitle').textContent='A continuación';
  const rest=S.queue.slice(S.qi+1);
  $('#panelBody').innerHTML=rest.length?rest.map((x,i)=>rowHTML(x,i,'q')).join('')
    :'<p style="color:#aaa;padding:16px;font-size:13px">Nada en la cola.</p>';
  CTX.q=rest;
}
async function showLyrics(){
  panelMode='lyrics';$('#panel').classList.add('open');
  $('#panelTitle').textContent='Letra';
  $('#panelBody').innerHTML='<p style="color:#aaa;padding:16px;font-size:13px">Buscando…</p>';
  if(!S.cur?.videoId)return;
  try{
    const j=await innertube('next',{videoId:S.cur.videoId});
    const tabs=nav(j,'contents.singleColumnMusicWatchNextResultsRenderer.tabbedRenderer.watchNextTabbedResultsRenderer.tabs')||[];
    const b=nav(tabs,'1.tabRenderer.content.sectionListRenderer.contents.0.musicDescriptionShelfRenderer');
    const text=b?(nav(b,'description.runs')||[]).map(r=>r.text).join(''):'';
    $('#panelBody').innerHTML=text?`<div class="lyr">${esc(text)}</div>`:'<p style="color:#aaa;padding:16px;font-size:13px">Sin letra.</p>';
  }catch{$('#panelBody').innerHTML='<p style="color:#aaa;padding:16px;font-size:13px">Sin letra.</p>';}
}

/* ============ eventos ============ */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g){e.preventDefault();location.hash=g.dataset.go;return;}

  const qi=e.target.closest('.qi');
  if(qi){const list=CTX.qp||[];const i=+qi.dataset.i;if(list[i])play(list[i],list,i);return;}

  const act=e.target.closest('[data-act]');
  if(act){
    const r=act.closest('.row');const list=CTX[r.dataset.ctx]||[];const t=list[+r.dataset.i];
    if(!t)return;
    if(act.dataset.act==='like'){
      const i=S.likes.findIndex(x=>x.videoId===t.videoId);
      i>-1?S.likes.splice(i,1):S.likes.unshift(t);save();paintLike();
      toast(i>-1?'Quitado de Me gusta':'Añadido a Me gusta');
    }
    if(act.dataset.act==='queue'){S.queue.splice(S.qi+1,0,t);renderPanel();toast('Añadido a la cola')}
    if(act.dataset.act==='menu')openMenu(act,t);
    return;
  }
  const row=e.target.closest('.row');
  if(row&&!e.target.closest('[data-stop]')){
    const list=CTX[row.dataset.ctx]||[];const i=+row.dataset.i;
    if(list[i])play(list[i],list,i);
    return;
  }
  const pl=e.target.closest('[data-pl]');
  if(pl){location.hash='#/playlist/'+pl.dataset.pl;return}
  const hh=e.target.closest('[data-h]');
  if(hh&&hh.dataset.h){location.hash='#/watch/'+hh.dataset.h;return}

  if(!e.target.closest('#menu'))$('#menu').classList.remove('open');
});

function openMenu(anchor,t){
  const m=$('#menu');
  m.innerHTML=`<button data-m="queue">Añadir a la cola</button>
    <button data-m="next">Reproducir a continuación</button>
    <button data-m="like">${S.likes.some(x=>x.videoId===t.videoId)?'Quitar de Me gusta':'Añadir a Me gusta'}</button>
    <button data-m="pl">Añadir a una lista</button>
    <button data-m="vid">${S.vid?'Ver como canción':'Ver como vídeo'}</button>`;
  const r=anchor.getBoundingClientRect();
  m.style.left=Math.min(r.left,innerWidth-250)+'px';
  m.style.top=Math.min(r.bottom+6,innerHeight-240)+'px';
  m.classList.add('open');
  m.onclick=ev=>{
    const a=ev.target.closest('[data-m]');if(!a)return;
    const k=a.dataset.m;m.classList.remove('open');
    if(k==='queue'){S.queue.splice(S.qi+1,0,t);renderPanel();toast('Añadido a la cola')}
    if(k==='next'){S.queue.splice(S.qi+1,0,t);renderPanel();next()}
    if(k==='like'){const i=S.likes.findIndex(x=>x.videoId===t.videoId);i>-1?S.likes.splice(i,1):S.likes.unshift(t);save();paintLike()}
    if(k==='pl')addToList(t);
    if(k==='vid'){S.vid=!S.vid;if(S.cur)play(S.cur)}
  };
}
function addToList(t){
  if(!S.lists.length){
    const n=prompt('Nombre de la lista');if(!n)return;
    S.lists.push({id:'l'+Date.now(),name:n,items:[t]});
  }else{
    const n=prompt('Número de lista:\n'+S.lists.map((l,i)=>i+1+'. '+l.name).join('\n'));
    const l=S.lists[+n-1];if(!l)return;l.items.push(t);
  }
  save();renderSide();toast('Añadido a la lista');
}

$('#q').addEventListener('input',e=>$('#qClear').classList.toggle('show',!!e.target.value));
$('#qClear').onclick=()=>{$('#q').value='';$('#qClear').classList.remove('show');$('#q').focus()};
$('#q').addEventListener('keydown',e=>{
  if(e.key==='Enter'){const v=e.target.value.trim();if(v)location.hash='#/search/'+encodeURIComponent(v)}
});
$('#newPl').onclick=()=>{const n=prompt('Nombre de la lista');if(!n)return;S.lists.push({id:'l'+Date.now(),name:n,items:[]});save();renderSide();route()};

$('#cPlay').onclick=toggle;
$('#cPrev').onclick=prev;
$('#cNext').onclick=next;
$('#cLike').onclick=()=>{if(!S.cur)return;const i=S.likes.findIndex(x=>x.videoId===S.cur.videoId);
  i>-1?S.likes.splice(i,1):S.likes.unshift(S.cur);save();paintLike()};
$('#cShuf').onclick=()=>{S.shuffle=!S.shuffle;$('#cShuf').classList.toggle('on',S.shuffle)};
$('#cRep').onclick=()=>{S.repeat=S.repeat==='off'?'all':S.repeat==='all'?'one':'off';
  $('#cRep').classList.toggle('on',S.repeat!=='off');$('#cRep').style.color=S.repeat==='one'?'#eab308':''};
$('#cQueue').onclick=()=>{panelMode='queue';$('#panel').classList.toggle('open');renderPanel()};
$('#cLyrics').onclick=showLyrics;
$('#panelClose').onclick=()=>$('#panel').classList.remove('open');
$('#vol').oninput=e=>{media.volume=e.target.value/100};
$('#cVol').onclick=()=>{media.muted=!media.muted;$('#cVol').style.color=media.muted?'#ff5252':''};
$('#track').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();
  if(media.duration)media.currentTime=((e.clientX-r.left)/r.width)*media.duration};
$('#npArt').onclick=()=>{if(S.cur){S.vid=!S.vid;play(S.cur)}};
$('#btnNet').onclick=()=>toast(directOK?'Ruta directa activa':'Solo proxies (directo bloqueado)');

addEventListener('keydown',e=>{
  if(/input|textarea/i.test(e.target.tagName))return;
  if(e.key===' '){e.preventDefault();toggle()}
  else if(e.key==='ArrowRight'&&media.duration)media.currentTime+=5;
  else if(e.key==='ArrowLeft')media.currentTime-=5;
  else if(e.key==='/'){e.preventDefault();$('#q').focus()}
});

media.volume=1;
renderSide();paintNow();route();
})();
</script>
