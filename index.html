<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Pentagram Music</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><circle cx='20' cy='20' r='17.5' fill='none' stroke='%23d92b3a' stroke-width='2'/><path d='M20 33.5 11.8 8.7 33.3 24.3H6.7l21.5-15.6z' fill='none' stroke='%23d92b3a' stroke-width='2'/></svg>">
<style>
  :root{
    --bg:#0b0b0d; --bg2:#111114; --card:#17171b; --line:#26262c; --line2:#35353d;
    --txt:#f3f3f5; --mut:#a2a2ab; --acc:#d92b3a; --acc2:#ff4757;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:14px;padding-bottom:76px}
  .shell{display:grid;grid-template-columns:212px 1fr;min-height:calc(100vh - 76px)}
  .side{position:sticky;top:0;align-self:start;height:calc(100vh - 76px);padding:14px 10px;border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;gap:2px;overflow-y:auto}
  .logo{display:flex;align-items:center;gap:9px;padding:6px 8px 16px;cursor:pointer}
  .logo b{font-size:14.5px;font-weight:600;letter-spacing:-.2px;line-height:1.1}
  .logo b span{display:block;font-size:9.5px;font-weight:500;color:var(--acc);letter-spacing:1.4px;text-transform:uppercase;margin-top:3px}
  .nav{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:7px;color:var(--mut);cursor:pointer;font-size:13px;font-weight:500;border:0;background:none;text-align:left;width:100%;font-family:inherit}
  .nav:hover{background:var(--card);color:var(--txt)}
  .nav.on{background:var(--card);color:var(--txt)}
  .nav.on svg{color:var(--acc)}
  .sep{height:1px;background:var(--line);margin:10px 8px}
  .side h4{font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--mut);margin:6px 10px 4px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
  .side h4 button{background:none;border:0;color:var(--mut);cursor:pointer;font-size:15px;line-height:1;padding:0 2px}
  .side h4 button:hover{color:var(--acc)}
  .plrow{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:7px;font-size:12.5px;color:var(--mut);cursor:pointer;overflow:hidden}
  .plrow:hover{background:var(--card);color:var(--txt)}
  .plrow span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sidefoot{margin-top:auto;font-size:10.5px;color:var(--mut);padding:14px 10px 0;line-height:1.6;border-top:1px solid var(--line)}
  .sidefoot a{color:var(--mut);text-decoration:underline;cursor:pointer}
  .main{min-width:0;padding-bottom:20px}
  .topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:12px 18px;background:rgba(11,11,13,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .ico{width:32px;height:32px;border-radius:50%;border:0;background:var(--card);color:var(--txt);display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
  .ico:hover{background:var(--line)}
  .searchwrap{flex:1;position:relative;max-width:460px;display:flex}
  .searchwrap input{width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:18px;padding:8px 14px 8px 36px;font-size:13px;font-family:inherit;outline:none}
  .searchwrap input:focus{border-color:var(--acc)}
  .searchwrap .mag{position:absolute;left:6px;top:50%;transform:translateY(-50%);width:26px;height:26px;border:0;background:none;color:var(--mut);cursor:pointer;display:grid;place-items:center;border-radius:50%}
  .searchwrap .mag:hover{color:var(--acc)}
  .badge{margin-left:auto;font-size:10.5px;padding:4px 9px;border-radius:20px;border:1px solid var(--line2);color:var(--mut);white-space:nowrap;cursor:pointer}
  .badge.ok{color:#4ade80;border-color:#1f4d33}
  .badge.bad{color:var(--acc2);border-color:#5a2027}
  .view{padding:20px 18px 30px}
  .hrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:0 0 14px}
  .hrow h1{font-size:24px;margin:0;letter-spacing:-.6px;font-weight:600}
  .hrow h2{font-size:16px;margin:0;letter-spacing:-.3px;font-weight:600}
  .hrow .more{font-size:11.5px;color:var(--mut);cursor:pointer}
  .hrow .more:hover{color:var(--acc)}
  .shelf{margin-bottom:26px}
  .cards{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
  .cards::-webkit-scrollbar{display:none}
  .card{width:146px;flex:0 0 auto;cursor:pointer}
  .card .art{position:relative;width:146px;height:146px;border-radius:9px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
  .card .art img{width:100%;height:100%;object-fit:cover;display:block}
  .card .art .pv{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.45);opacity:0;transition:opacity .15s}
  .card:hover .art .pv{opacity:1}
  .pv b{width:38px;height:38px;border-radius:50%;background:var(--acc);display:grid;place-items:center;color:#fff}
  .card .tt{font-size:12.5px;font-weight:500;margin-top:8px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .sb{font-size:11px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .tag{position:absolute;top:6px;left:6px;font-size:9px;letter-spacing:.6px;text-transform:uppercase;background:rgba(0,0,0,.72);border:1px solid var(--line2);color:#fff;padding:2px 6px;border-radius:4px;font-weight:600}
  .round .art{border-radius:50%}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
  .chip{padding:6px 13px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:12px;color:var(--mut);cursor:pointer;font-family:inherit}
  .chip:hover,.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .tracklist{margin-top:6px}
  .tr{display:grid;grid-template-columns:22px 40px 1fr auto auto;gap:11px;align-items:center;padding:6px;border-radius:7px;cursor:pointer}
  .tr:hover{background:var(--card)}
  .tr.on .t1{color:var(--acc)}
  .tr .n{font-size:11px;color:var(--mut);text-align:right}
  .tr .th{width:40px;height:40px;border-radius:5px;overflow:hidden;background:var(--card);border:1px solid var(--line);position:relative}
  .tr .th img{width:100%;height:100%;object-fit:cover;display:block}
  .tr .t1{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tr .t2{font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .tr .t2 a{color:inherit;text-decoration:none}
  .tr .t2 a:hover{text-decoration:underline;color:var(--txt)}
  .tr .d{font-size:11.5px;color:var(--mut);font-variant-numeric:tabular-nums;padding-right:4px}
  .tr .add{width:24px;height:24px;border-radius:50%;border:1px solid var(--line2);background:none;color:var(--mut);cursor:pointer;display:grid;place-items:center;opacity:0}
  .tr:hover .add{opacity:1}
  .tr .add:hover{color:var(--acc);border-color:var(--acc)}
  .hero{display:flex;gap:18px;align-items:flex-end;margin-bottom:22px}
  .hero .art{width:170px;height:170px;border-radius:10px;overflow:hidden;background:var(--card);border:1px solid var(--line);flex:0 0 auto}
  .hero .art img{width:100%;height:100%;object-fit:cover}
  .hero .art.rnd{border-radius:50%}
  .hero .k{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mut);font-weight:600}
  .hero h1{font-size:30px;margin:6px 0 8px;letter-spacing:-.9px;line-height:1.1}
  .hero .meta{font-size:12px;color:var(--mut);max-height:52px;overflow:hidden}
  .actions{display:flex;gap:9px;margin:16px 0 4px;align-items:center}
  .btn{border:0;border-radius:20px;padding:9px 20px;font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer;background:var(--acc);color:#fff;display:flex;align-items:center;gap:7px}
  .btn:hover{background:var(--acc2)}
  .btn.o{background:transparent;border:1px solid var(--line2);color:var(--txt)}
  .btn.o:hover{background:var(--card)}
  .sq{width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);background:transparent;color:var(--mut);display:grid;place-items:center;cursor:pointer}
  .sq:hover{color:var(--txt);background:var(--card)}
  .sq.on{color:var(--acc);border-color:var(--acc)}
  .note{font-size:11.5px;color:var(--mut);background:var(--card);border:1px solid var(--line);border-left:2px solid var(--acc);border-radius:6px;padding:9px 12px;margin-bottom:16px;line-height:1.6}
  .empty{font-size:12.5px;color:var(--mut);padding:26px 0;line-height:1.7}
  .player{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;padding:10px 16px;background:var(--bg2);border-top:1px solid var(--line)}
  .np{display:flex;align-items:center;gap:11px;min-width:0}
  .np .art{width:48px;height:48px;border-radius:5px;overflow:hidden;background:var(--card);border:1px solid var(--line);flex:0 0 auto;cursor:pointer}
  .np .art img{width:100%;height:100%;object-fit:cover;display:block}
  .np .m{min-width:0;cursor:pointer}
  .np .m b{display:block;font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .np .m small{display:block;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .mid{display:flex;flex-direction:column;align-items:center;gap:5px;width:290px}
  .ctr{display:flex;align-items:center;gap:4px}
  .pb{width:26px;height:26px;padding:0;display:grid;place-items:center;background:none;border:0;color:var(--mut);cursor:pointer;border-radius:50%}
  .pb:hover{color:var(--txt)}
  .pb.on{color:var(--acc)}
  .pb.play{width:34px;height:34px;background:var(--txt);color:#000;border-radius:50%}
  .pb.play:hover{transform:scale(1.06);color:#000}
  .prog{display:flex;align-items:center;gap:8px;width:100%;font-size:10px;color:var(--mut);font-variant-numeric:tabular-nums}
  .bar{flex:1;height:3px;background:var(--line2);border-radius:2px;cursor:pointer;position:relative}
  .bar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--acc);border-radius:2px}
  .right{display:flex;align-items:center;justify-content:flex-end;gap:6px}
  input[type=range]{-webkit-appearance:none;appearance:none;width:72px;height:3px;border-radius:2px;background:var(--line2);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:var(--txt);cursor:pointer}
  .qpanel{position:fixed;right:0;bottom:76px;width:340px;max-height:60vh;overflow-y:auto;display:none;padding:16px 18px;border:1px solid var(--line);border-radius:10px 0 0 0;background:var(--bg2);z-index:19}
  .qpanel.open{display:block}
  .qpanel .qh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--acc);color:#fff;font-size:12px;padding:7px 16px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
  .toast.show{opacity:1}

  #media{display:block;width:100%;height:100%;object-fit:contain;background:#000}
  .stage{position:relative;width:100%;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#000;border:1px solid var(--line);display:grid;place-items:center}
  .stage img{width:100%;height:100%;object-fit:cover;display:block}
  .stage.audio #media{display:none}
  .stage canvas{position:absolute;inset:auto 0 0 0;width:100%;height:38%;pointer-events:none}
  .stage:not(.audio) img{display:none}
  .stage:not(.audio) canvas{display:none}
  .stage.mini{position:fixed;right:16px;bottom:88px;width:224px;aspect-ratio:16/9;z-index:18;border-radius:9px;border-color:var(--line2);box-shadow:0 10px 30px rgba(0,0,0,.55);cursor:pointer}

  .npv{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;background:var(--bg);overflow:hidden}
  .npv.open{display:flex}
  .npv .bg{position:absolute;inset:-80px;background-size:cover;background-position:center;filter:blur(70px) saturate(1.5) brightness(.32);transform:scale(1.2)}
  .npv .in{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:36px;padding:20px 40px;flex:1;min-height:0}
  .npv .col{min-width:0;display:flex;flex-direction:column;justify-content:center;max-height:100%}
  .npv .top{display:flex;align-items:center;gap:10px;padding:14px 22px 0;position:relative;z-index:1}
  .npv .top .end{margin-left:auto;display:flex;gap:8px}
  .npv .k{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mut);font-weight:600}
  .npv h1{font-size:clamp(20px,3.2vw,36px);margin:10px 0 6px;letter-spacing:-1.1px;line-height:1.1}
  .npv .sub{font-size:13px;color:var(--mut);cursor:pointer}
  .npv .sub:hover{color:var(--txt);text-decoration:underline}
  .npv .ctl{display:flex;align-items:center;gap:14px;margin-top:20px}
  .npv .ctl .pb{width:42px;height:42px}
  .npv .ctl .pb.play{width:54px;height:54px}
  .npv .prog{margin-top:16px}
  .npv .foot{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:11px;color:var(--mut);flex-wrap:wrap}

  .sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:none;place-items:center;padding:20px}
  .sheet.open{display:grid}
  .sheet .box{width:100%;max-width:420px;max-height:86vh;overflow-y:auto;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:18px}
  .sheet h3{margin:0 0 12px;font-size:14px}
  .sheet .row{display:flex;align-items:center;gap:9px;padding:8px;border-radius:7px;cursor:pointer;font-size:12.5px}
  .sheet .row:hover{background:var(--card)}
  .sheet input{width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:8px 11px;font-size:12.5px;font-family:inherit;outline:none;margin-bottom:10px}
  .sheet input:focus{border-color:var(--acc)}
  .sheet .close{float:right;background:none;border:0;color:var(--mut);cursor:pointer;font-size:16px}
  .sheet .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
  .sheet .hst{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-size:11.5px;font-family:ui-monospace,monospace;background:var(--card);margin-bottom:5px}
  .sheet .hst b{font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sheet .dot{width:7px;height:7px;border-radius:50%;background:var(--line2);flex:0 0 auto}
  .sheet .dot.g{background:#4ade80}.sheet .dot.r{background:var(--acc2)}.sheet .dot.y{background:#eab308}
  .sheet .x{background:none;border:0;color:var(--mut);cursor:pointer;font-size:13px;padding:0 2px}
  .sheet .x:hover{color:var(--acc2)}
  .sheet .sec{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);font-weight:600;margin:16px 0 7px}

  @media(max-width:760px){
    .shell{grid-template-columns:1fr}.side{display:none}.mid{width:170px}.player{grid-template-columns:1fr auto}
    .right input[type=range]{display:none}
    .npv .in{grid-template-columns:1fr;gap:16px;padding:14px 18px;overflow-y:auto}
    .npv .col.stagecol{max-width:250px;margin:0 auto;width:100%;flex:0 0 auto}
    .npv h1{font-size:21px}
    .npv .ctl .pb.play{width:48px;height:48px}
    .stage.mini{width:150px;bottom:84px;right:10px}
  }
</style>
</head>
<body>

<div class="shell">
  <aside class="side">
    <div class="logo" onclick="location.hash='#/'">
      <svg width="30" height="30" viewBox="0 0 40 40" fill="none" stroke="#d92b3a" stroke-width="1.7" stroke-linejoin="round">
        <circle cx="20" cy="20" r="17.5"/><path d="M20 33.5 11.8 8.7 33.3 24.3H6.7l21.5-15.6z"/>
      </svg>
      <b>Pentagram<span>Music</span></b>
    </div>
    <button class="nav on" data-go="#/"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5V21H3z"/></svg>Inicio</button>
    <button class="nav" data-go="#/explore"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m15 9-2 4-4 2 2-4z"/></svg>Explorar</button>
    <button class="nav" data-go="#/library"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h4v16H4zM11 4h4v16h-4zM18 4l3 16"/></svg>Biblioteca</button>
    <div class="sep"></div>
    <h4>Listas <button id="newList" title="Nueva lista">+</button></h4>
    <div id="sideLists"></div>
    <div class="sidefoot">Canciones y vídeos.<br>Reproducción directa, sin anuncios.<br><a id="openCfg">Fuentes de red</a></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="ico" id="back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></button>
      <button class="ico" id="fwd"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></button>
      <div class="searchwrap">
        <button class="mag" id="go"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
        <input id="q" placeholder="Buscar canciones o vídeos" autocomplete="off">
      </div>
      <div class="badge" id="netBadge">listo</div>
    </header>
    <div class="view" id="view"></div>
  </main>
</div>

<div class="qpanel" id="qpanel">
  <div class="qh"><b style="font-size:13px">Cola</b><button class="btn o" id="qclear" style="padding:5px 12px;font-size:11px">Vaciar</button></div>
  <div id="qlist"></div>
</div>

<div class="npv" id="npv">
  <div class="bg" id="npBg"></div>
  <div class="top">
    <button class="sq" id="npClose" title="Cerrar"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button>
    <div class="k" id="npK">Reproduciendo</div>
    <div class="end">
      <button class="sq" id="npHd" title="Calidad">HD</button>
      <button class="sq" id="npVid" title="Vídeo / solo audio"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="m16 11 6-3v8l-6-3z"/></svg></button>
      <button class="sq" id="npLike" title="Me gusta"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 1 0-7.1 7.1L12 21l8.8-8.3a5 5 0 0 0 0-7.1z"/></svg></button>
      <button class="sq" id="npAdd" title="Añadir a lista"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
  </div>
  <div class="in">
    <div class="col stagecol">
      <div class="stage" id="stage">
        <video id="media" playsinline preload="metadata"></video>
        <img id="bigArt" alt="">
        <canvas id="viz"></canvas>
      </div>
    </div>
    <div class="col">
      <div class="k" id="npKind">—</div>
      <h1 id="npTitle">Nada sonando</h1>
      <div class="sub" id="npArtist">—</div>
      <div class="ctl">
        <button class="pb" id="npShuf" title="Aleatorio"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
        <button class="pb" id="npPrev" title="Anterior"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14l-11-7z"/></svg></button>
        <button class="pb play" id="npPlay" title="Play/Pausa"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
        <button class="pb" id="npNext" title="Siguiente"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5l11 7-11 7z"/></svg></button>

  function tx(mode,fn){
    return open().then(function(d){
      if(!d) throw 0;
      return new Promise(function(res,rej){
        var t=d.transaction(STORE,mode), s=t.objectStore(STORE), q=fn(s);
        t.oncomplete=function(){ res(q&&q.result); };
        t.onerror=function(){ rej(t.error); };
      });
    });
  }
  return {
    get:function(k){ return tx('readonly',function(s){return s.get(k);}).catch(function(){
      try{ return JSON.parse(localStorage.getItem('pg_'+k)); }catch(e){ return null; }

  var c=new AbortController(), t=setTimeout(function(){c.abort();},ms||9000);

    .finally(function(){ clearTimeout(t); });

function race(urls,ms,keys){
  ms=ms||9000;
  return new Promise(function(res,rej){
    var done=false, f=0;
    function kill(){ if(!done){ done=true; rej(new Error('sin respuesta')); } }
    urls.forEach(function(u,i){
      j(u,ms).then(function(d){
        if(done) return;
        done=true;
        if(keys&&keys[i]) bump(keys[i],true);
        res(d);
      }).catch(function(){
        if(keys&&keys[i]) bump(keys[i],false);

/* Construye la lista de URLs: primero hosts con CORS nativo, luego proxies

  hosts.filter(function(h){return h.cors;}).slice(0,1).forEach(function(h){
    urls.push(h.u+path); keys.push(h.u);

  proxies.slice(0,2).forEach(function(p){
    hosts.slice(0,3).forEach(function(h){
      urls.push(pxWrap(p)(h.u+path)); keys.push(p);

  });
  return {urls:urls,keys:keys};
}

  var id=it.videoId||(m?m[1]:'');

}

   El elemento <video> no necesita CORS: solo importa el bloqueo por IP,

function srcChain(t,wantVideo){
  var hs=orderedHosts(), ps=orderedProxies().slice(0,2), out=[], i, k;
  function push(u,label,mode){ out.push({u:u,k:label,m:mode}); }

  if(wantVideo){
    var vq=S.hd?[22,18]:[18];
    for(i=0;i<hs.length;i++) for(k=0;k<vq.length;k++)

    for(i=0;i<hs.length;i++)
      push(hs[i].u+'/latest_version?id='+t.id+'&itag=140&local=true','audio · '+hs[i].u.replace(/https:\/\//,''),'audio');
  }else{
    var aq=[140,251,139];
    for(i=0;i<hs.length;i++) for(k=0;k<aq.length;k++)
      push(hs[i].u+'/latest_version?id='+t.id+'&itag='+aq[k]+'&local=true',(aq[k]===140?'audio 128k':aq[k]===251?'opus':'audio 48k')+' · '+hs[i].u.replace(/https:\/\//,''),'audio');
    for(i=0;i<hs.length;i++)
      push(hs[i].u+'/latest_version?id='+t.id+'&itag=18&local=true','360p · '+hs[i].u.replace(/https:\/\//,''),'video');
  }
  /* proxificado: salta el bloqueo por IP del todo */
  ps.forEach(function(p){
    push(pxWrap(p)(hs[0].u+'/latest_version?id='+t.id+'&itag='+(wantVideo?(S.hd?22:18):140)+'&local=true'),'vía proxy','video');
  });
  /* sin local: URL directa de googlevideo */
  for(i=0;i<hs.length;i++)
    push(hs[i].u+'/latest_version?id='+t.id+'&itag='+(wantVideo?18:140),'directo · '+hs[i].u.replace(/https:\/\//,''),wantVideo?'video':'audio');
  return out;
}
function pipedSrc(id,wantVideo){

    var a=((wantVideo?d.videoStreams:d.audioStreams)||[]).sort(function(x,y){return (y.bitrate||0)-(x.bitrate||0);});

      artwork:[{src:t.thumb,sizes:'480x360',type:'image/jpeg'}]});
    navigator.mediaSession.setActionHandler('play',function(){media.play();});
    navigator.mediaSession.setActionHandler('pause',function(){media.pause();});

    navigator.mediaSession.setActionHandler('nexttrack',next);
  }catch(e){}

var vctx=viz.getContext('2d'), t0=Date.now();
function vizLoop(){
  requestAnimationFrame(vizLoop);
  if(!S.playing||S.srcKind==='video'||!$('#npv').classList.contains('open')) return;
  var w=viz.width=viz.clientWidth, h=viz.height=viz.clientHeight;
  if(!w) return;
  vctx.clearRect(0,0,w,h);
  var n=Math.max(18,Math.floor(w/9)), t=(Date.now()-t0)/1000;
  for(var i=0;i<n;i++){
    var a=Math.abs(Math.sin(t*2.2+i*0.42))*.6+Math.abs(Math.sin(t*0.9+i*0.13))*.4;
    var bh=Math.max(2,a*h*.92), x=i*(w/n)+2;
    vctx.fillStyle='rgba(217,43,58,'+(0.22+a*0.78)+')';
    vctx.fillRect(x,h-bh,w/n-4,bh);
  }
}
vizLoop();

    +'<div class="note" style="margin-bottom:12px">Las instancias públicas caducan. Si algo deja de cargar, añade una viva desde <b>api.invidious.io</b> o pega un proxy propio. Los puntos son la salud local: verde responde, rojo falla.</div>'

  $('#addHost').onclick=function(){
    var v=$('#newHost').value.trim().replace(/\/$/,'');
    if(!/^https?:\/\//.test(v)) return toast('URL no válida');

  };

  };

    });
    Promise.all(jobs).then(function(r){
      out.innerHTML=r.map(function(x){return esc(x);}).join('<br>');
      cfg2();
    });
  };
  function cfg2(){ /* repinta sin reabrir */ }

  view.innerHTML+=(S.likes.length? '<div class="actions"><button class="btn" id="lkPlay">Reproducir</button></div>'+trackList(S.likes,'lk')
    : '<div class="empty">Todavía no has marcado nada.</div>');
  var b=$('#lkPlay'); if(b) b.onclick=function(){ S.queue=S.likes.slice(); S.qi=0; renderQueue(); playTrack(S.likes[0]); };
}

function historyView(){
  view.innerHTML='<div class="hrow"><h1>Historial</h1><span class="more" id="hClr">Vaciar</span></div>';
  view.innerHTML+=(S.hist.length? trackList(S.hist,'hs') : '<div class="empty">Sin historial.</div>');
  $('#hClr').onclick=function(){ S.hist=[]; save(); historyView(); };
}

/* =======================================================================
   ROUTER
   ======================================================================= */
var ROUTES={home:home,explore:explore,library:library,search:searchView,artist:artistView,album:albumView,playlist:playlistView,likes:likesView,history:historyView};
function router(){
  navToken++;
  var raw=location.hash.replace(/^#\/?/,'');
  var parts=raw.split('/').filter(Boolean).map(function(s){ try{ return decodeURIComponent(s); }catch(e){ return s; } });
  var name=parts[0]||'home';
  var fn=ROUTES[name]||home;
  $$('.nav').forEach(function(b){
    var g=(b.dataset.go||'').replace(/^#\//,'')||'home';
    b.classList.toggle('on', g===name);
  });
  window.scrollTo(0,0);
  $('#qpanel').classList.remove('open');
  view.innerHTML='';
  fn(parts.slice(1));
}
window.addEventListener('hashchange',router);

document.addEventListener('click',function(e){
  var g=e.target.closest('[data-go]');
  if(g){ e.preventDefault(); location.hash=g.dataset.go; return; }
});
view.addEventListener('click',function(e){
  if(e.target.closest('[data-stop]')) return;
  var add=e.target.closest('.add'), r=e.target.closest('.tr');
  if(add&&r){ e.stopPropagation(); addQueue((CTX[r.dataset.ctx]||[])[+r.dataset.i]); return; }
  if(r){
    var list=CTX[r.dataset.ctx]||[], i=+r.dataset.i;
    if(!list[i]) return;
    S.queue=list.slice(); S.qi=i; renderQueue(); playTrack(list[i]); save(); return;
  }
  var c=e.target.closest('.card');
  if(c){
    var wrap=c.closest('.cards');
    var arr=$$('.card',wrap).map(function(el){
      return {id:el.dataset.id,kind:el.dataset.kind,title:el.querySelector('.tt').textContent,
              artist:el.querySelector('.sb').textContent,dur:0,thumb:el.querySelector('img').src,artistId:''};
    });
    var j=$$('.card',wrap).indexOf(c);
    S.queue=arr; S.qi=j; renderQueue(); playTrack(arr[j]); save();
  }
});

/* =======================================================================
   CONTROLES
   ======================================================================= */
$('#back').onclick=function(){ history.back(); };
$('#fwd').onclick=function(){ history.forward(); };
$('#go').onclick=function(){ var v=$('#q').value.trim(); if(v) location.hash='#/search/'+encodeURIComponent(v)+'/music'; };
$('#q').addEventListener('keydown',function(e){
  if(e.key==='Enter'){ var v=this.value.trim(); if(v) location.hash='#/search/'+encodeURIComponent(v)+'/music'; }
});
var typing=0;
$('#q').addEventListener('input',function(){
  clearTimeout(typing);
  var v=this.value.trim();
  if(!v) return;
  typing=setTimeout(function(){
    if($('#q').value.trim()!==v) return;
    location.hash='#/search/'+encodeURIComponent(v)+'/music';
  },650);
});

$('#pPlay').onclick=toggle; $('#npPlay').onclick=toggle;
$('#pPrev').onclick=prev; $('#npPrev').onclick=prev;
$('#pNext').onclick=next; $('#npNext').onclick=next;

function paintShuf(){ $('#pShuf').classList.toggle('on',S.shuffle); $('#npShuf').classList.toggle('on',S.shuffle); }
function paintRep(){
  var on=S.repeat!=='off';
  $('#pRep').classList.toggle('on',on); $('#npRep').classList.toggle('on',on);
  $('#pRep').title=S.repeat==='off'?'Repetir: off':S.repeat==='all'?'Repetir: todo':'Repetir: una';
}
$('#pShuf').onclick=$('#npShuf').onclick=function(){ S.shuffle=!S.shuffle; paintShuf(); save(); };
$('#pRep').onclick=$('#npRep').onclick=function(){
  S.repeat=S.repeat==='off'?'all':S.repeat==='all'?'one':'off';
  paintRep(); save();
};

$('#pLike').onclick=$('#npLike').onclick=function(){ toggleLike(S.cur); };
$('#npAdd').onclick=function(){ if(S.cur) addToPlaylist(S.cur); };
$('#pVid').onclick=$('#npVid').onclick=function(){ setVid(!S.vid); };
$('#npHd').onclick=function(){ setHd(!S.hd); };

function seekTo(e,el){
  var r=el.getBoundingClientRect();
  var x=Math.min(Math.max(e.clientX-r.left,0),r.width);
  if(media.duration) media.currentTime=(x/r.width)*media.duration;
}
$('#bar').addEventListener('click',function(e){ seekTo(e,this); });
$('#npBar').addEventListener('click',function(e){ seekTo(e,this); });

$('#vol').addEventListener('input',function(){ S.vol=+this.value; media.volume=S.vol/100; save(); });

function openNP(){ if(!S.cur) return; $('#npv').classList.add('open'); syncStage(); }
function closeNP(){ $('#npv').classList.remove('open'); syncStage(); }
$('#pArt').onclick=openNP; $('#pMeta').onclick=openNP;
$('#npClose').onclick=closeNP;
stage.addEventListener('click',function(){ if(stage.classList.contains('mini')) openNP(); });
$('#npArtist').onclick=function(){ if(S.cur&&S.cur.artistId) location.hash='#/artist/'+S.cur.artistId; };

document.addEventListener('keydown',function(e){
  if(/input|textarea/i.test(e.target.tagName)) return;
  if(e.key===' '){ e.preventDefault(); toggle(); }
  else if(e.key==='ArrowRight'&&media.duration){ media.currentTime=Math.min(media.duration,media.currentTime+5); }
  else if(e.key==='ArrowLeft'){ media.currentTime=Math.max(0,media.currentTime-5); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); S.vol=Math.min(100,S.vol+5); media.volume=S.vol/100; $('#vol').value=S.vol; save(); }
  else if(e.key==='ArrowDown'){ e.preventDefault(); S.vol=Math.max(0,S.vol-5); media.volume=S.vol/100; $('#vol').value=S.vol; save(); }
  else if(e.key==='m'){ media.muted=!media.muted; }
  else if(e.key==='/'){ e.preventDefault(); $('#q').focus(); }
  else if(e.key==='Escape'){ closeNP(); closeSheet(); $('#qpanel').classList.remove('open'); }
  else if(e.key==='n'){ next(); }
  else if(e.key==='p'){ prev(); }
});

window.addEventListener('online',function(){ net('en línea','ok'); });
window.addEventListener('offline',function(){ net('sin conexión','bad'); });
if(!navigator.onLine) net('sin conexión','bad');

/* =======================================================================
   ARRANQUE
   ======================================================================= */
Promise.all([db.get('state'),db.get('likes'),db.get('lists'),db.get('hist'),db.get('cfg'),db.get('health')]).then(function(r){
  var st=r[0]||{};
  S.queue=st.queue||[]; S.qi=(typeof st.qi==='number'?st.qi:-1);
  S.shuffle=!!st.shuffle; S.repeat=st.repeat||'off';
  S.vol=(typeof st.vol==='number'?st.vol:85); S.vid=!!st.vid;
  S.hd=(typeof st.hd==='boolean'?st.hd:true);
  S.likes=r[1]||[]; S.lists=r[2]||[]; S.hist=r[3]||[];
  health=r[5]||{};
  var cfgd=r[4];
  if(cfgd&&cfgd.hosts&&cfgd.hosts.length) HOSTS=cfgd.hosts;
  if(cfgd&&cfgd.proxies&&cfgd.proxies.length) PROXIES=cfgd.proxies;
  media.volume=S.vol/100; $('#vol').value=S.vol;
  if(S.qi>=S.queue.length) S.qi=S.queue.length-1;
  S.cur=(S.qi>=0?S.queue[S.qi]:null);
  if(S.cur){
    bigArt.src=S.cur.thumb;
    $('#npBg').style.backgroundImage='url("'+S.cur.thumb+'")';
    S.srcKind=S.cur.kind==='video'?'video':'audio';
    S.chain=srcChain(S.cur,S.cur.kind==='video');
    S.ci=0;
  }
  renderSideLists(); renderQueue(); paintShuf(); paintRep(); paintNow(); paintVidBtns();
  router();
  if(!location.hash) location.hash='#/';
});
})();
</script>
