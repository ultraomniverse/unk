<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Pentagram Music</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><circle cx='20' cy='20' r='17.5' fill='none' stroke='%23d92b3a' stroke-width='2'/><path d='M20 33.5 11.8 8.7 33.3 24.3H6.7l21.5-15.6z' fill='none' stroke='%23d92b3a' stroke-width='2'/></svg>">
<style>
  :root{
    --bg:#0b0b0d; --bg2:#111114; --card:#17171b; --line:#26262c; --line2:#35353d;
    --txt:#f3f3f5; --mut:#a2a2ab; --acc:#d92b3a; --acc2:#ff4757;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:14px;padding-bottom:76px}
  .shell{display:grid;grid-template-columns:212px 1fr;min-height:calc(100vh - 76px)}
  .side{position:sticky;top:0;align-self:start;height:calc(100vh - 76px);padding:14px 10px;border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;gap:2px;overflow-y:auto}
  .logo{display:flex;align-items:center;gap:9px;padding:6px 8px 16px;cursor:pointer}
  .logo svg{flex:0 0 auto}
  .logo b{font-size:14.5px;font-weight:600;letter-spacing:-.2px;line-height:1.1}
  .logo b span{display:block;font-size:9.5px;font-weight:500;color:var(--acc);letter-spacing:1.4px;text-transform:uppercase;margin-top:3px}
  .nav{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:7px;color:var(--mut);cursor:pointer;font-size:13px;font-weight:500;border:0;background:none;text-align:left;width:100%;font-family:inherit}
  .nav:hover{background:var(--card);color:var(--txt)}
  .nav.on{background:var(--card);color:var(--txt)}
  .nav.on svg{color:var(--acc)}
  .nav svg{flex:0 0 auto;opacity:.85}
  .sep{height:1px;background:var(--line);margin:10px 8px}
  .side h4{font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--mut);margin:6px 10px 4px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
  .side h4 button{background:none;border:0;color:var(--mut);cursor:pointer;font-size:15px;line-height:1;padding:0 2px}
  .side h4 button:hover{color:var(--acc)}
  .plrow{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:7px;font-size:12.5px;color:var(--mut);cursor:pointer;overflow:hidden}
  .plrow:hover{background:var(--card);color:var(--txt)}
  .plrow span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sidefoot{margin-top:auto;font-size:10.5px;color:var(--mut);padding:14px 10px 0;line-height:1.6;border-top:1px solid var(--line)}
  .main{min-width:0;padding-bottom:20px}
  .topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:12px 18px;background:rgba(11,11,13,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .ico{width:32px;height:32px;border-radius:50%;border:0;background:var(--card);color:var(--txt);display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
  .ico:hover{background:var(--line)}
  .searchwrap{flex:1;position:relative;max-width:460px;display:flex}
  .searchwrap input{width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:18px;padding:8px 14px 8px 36px;font-size:13px;font-family:inherit;outline:none}
  .searchwrap input:focus{border-color:var(--acc)}
  .searchwrap .mag{position:absolute;left:6px;top:50%;transform:translateY(-50%);width:26px;height:26px;border:0;background:none;color:var(--mut);cursor:pointer;display:grid;place-items:center;border-radius:50%}
  .searchwrap .mag:hover{color:var(--acc)}
  .badge{margin-left:auto;font-size:10.5px;padding:4px 9px;border-radius:20px;border:1px solid var(--line2);color:var(--mut);white-space:nowrap;cursor:pointer}
  .view{padding:20px 18px 30px}
  .hrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:0 0 14px}
  .hrow h1{font-size:24px;margin:0;letter-spacing:-.6px;font-weight:600}
  .hrow h2{font-size:16px;margin:0;letter-spacing:-.3px;font-weight:600}
  .shelf{margin-bottom:26px}
  .cards{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
  .cards::-webkit-scrollbar{display:none}
  .card{width:146px;flex:0 0 auto;cursor:pointer}
  .card .art{position:relative;width:146px;height:146px;border-radius:9px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
  .card .art img{width:100%;height:100%;object-fit:cover;display:block}
  .card .art .pv{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.45);opacity:0;transition:opacity .15s}
  .card:hover .art .pv{opacity:1}
  .pv b{width:38px;height:38px;border-radius:50%;background:var(--acc);display:grid;place-items:center;color:#fff}
  .card .tt{font-size:12.5px;font-weight:500;margin-top:8px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .sb{font-size:11px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .round .art{border-radius:50%}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
  .chip{padding:6px 13px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:12px;color:var(--mut);cursor:pointer;font-family:inherit}
  .chip:hover,.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .tracklist{margin-top:6px}
  .tr{display:grid;grid-template-columns:22px 40px 1fr auto auto;gap:11px;align-items:center;padding:6px;border-radius:7px;cursor:pointer}
  .tr:hover{background:var(--card)}
  .tr.on .t1{color:var(--acc)}
  .tr .n{font-size:11px;color:var(--mut);text-align:right}
  .tr .th{width:40px;height:40px;border-radius:5px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
  .tr .th img{width:100%;height:100%;object-fit:cover;display:block}
  .tr .t1{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tr .t2{font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .tr .t2 a{color:inherit;text-decoration:none}
  .tr .t2 a:hover{text-decoration:underline;color:var(--txt)}
  .tr .d{font-size:11.5px;color:var(--mut);font-variant-numeric:tabular-nums;padding-right:4px}
  .tr .add{width:24px;height:24px;border-radius:50%;border:1px solid var(--line2);background:none;color:var(--mut);cursor:pointer;display:grid;place-items:center;opacity:0}
  .tr:hover .add{opacity:1}
  .tr .add:hover{color:var(--acc);border-color:var(--acc)}
  .hero{display:flex;gap:18px;align-items:flex-end;margin-bottom:22px}
  .hero .art{width:170px;height:170px;border-radius:10px;overflow:hidden;background:var(--card);border:1px solid var(--line);flex:0 0 auto}
  .hero .art img{width:100%;height:100%;object-fit:cover}
  .hero .art.rnd{border-radius:50%}
  .hero .k{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mut);font-weight:600}
  .hero h1{font-size:30px;margin:6px 0 8px;letter-spacing:-.9px;line-height:1.1}
  .hero .meta{font-size:12px;color:var(--mut);max-height:52px;overflow:hidden}
  .actions{display:flex;gap:9px;margin:16px 0 4px;align-items:center}
  .btn{border:0;border-radius:20px;padding:9px 20px;font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer;background:var(--acc);color:#fff;display:flex;align-items:center;gap:7px}
  .btn:hover{background:var(--acc2)}
  .btn.o{background:transparent;border:1px solid var(--line2);color:var(--txt)}
  .btn.o:hover{background:var(--card)}
  .sq{width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);background:transparent;color:var(--mut);display:grid;place-items:center;cursor:pointer}
  .sq:hover{color:var(--txt);background:var(--card)}
  .sq.on{color:var(--acc);border-color:var(--acc)}
  .note{font-size:11.5px;color:var(--mut);background:var(--card);border:1px solid var(--line);border-left:2px solid var(--acc);border-radius:6px;padding:9px 12px;margin-bottom:16px;line-height:1.6}
  .note .btn{margin-top:9px}
  .player{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;padding:10px 16px;background:var(--bg2);border-top:1px solid var(--line)}
  .np{display:flex;align-items:center;gap:11px;min-width:0}
  .np .art{width:48px;height:48px;border-radius:5px;overflow:hidden;background:var(--card);border:1px solid var(--line);flex:0 0 auto}
  .np .art img{width:100%;height:100%;object-fit:cover;display:block}
  .np .m{min-width:0}
  .np .m b{display:block;font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .np .m small{display:block;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .mid{display:flex;flex-direction:column;align-items:center;gap:5px;width:290px}
  .ctr{display:flex;align-items:center;gap:4px}
  .pb{width:26px;height:26px;padding:0;display:grid;place-items:center;background:none;border:0;color:var(--mut);cursor:pointer;border-radius:50%}
  .pb:hover{color:var(--txt)}
  .pb.on{color:var(--acc)}
  .pb.play{width:34px;height:34px;background:var(--txt);color:#000;border-radius:50%}
  .pb.play:hover{transform:scale(1.06);color:#000}
  .prog{display:flex;align-items:center;gap:8px;width:100%;font-size:10px;color:var(--mut);font-variant-numeric:tabular-nums}
  .bar{flex:1;height:3px;background:var(--line2);border-radius:2px;cursor:pointer;position:relative}
  .bar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--acc);border-radius:2px}
  .right{display:flex;align-items:center;justify-content:flex-end;gap:6px}
  input[type=range]{-webkit-appearance:none;appearance:none;width:72px;height:3px;border-radius:2px;background:var(--line2);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:var(--txt);cursor:pointer}
  .vid{width:118px;height:66px;border-radius:6px;overflow:hidden;background:#000;border:1px solid var(--line);display:none}
  .vid iframe{width:100%;height:100%;border:0;display:block}
  .qpanel{position:fixed;right:0;bottom:76px;width:340px;max-height:60vh;overflow-y:auto;display:none;padding:16px 18px;border:1px solid var(--line);border-radius:10px 0 0 0;background:var(--bg2);z-index:19}
  .qpanel.open{display:block}
  .qpanel .qh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--acc);color:#fff;font-size:12px;padding:7px 16px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
  .toast.show{opacity:1}
  .sk{background:linear-gradient(90deg,var(--card) 25%,var(--line) 50%,var(--card) 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:6px}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
  @media(max-width:760px){.shell{grid-template-columns:1fr}.side{display:none}.mid{width:180px}.player{grid-template-columns:1fr auto}}
</style>
</head>

(function(){
'use strict';

var $=function(s,r){return (r||document).querySelector(s);},
    $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};

/* =======================================================================
   ALMACÉN
   ======================================================================= */
var db=(function(){
  var NAME='pentagram', STORE='kv', h=null;
  function open(){
    if(h) return Promise.resolve(h);
    return new Promise(function(res){
      var r=indexedDB.open(NAME,1);
      r.onupgradeneeded=function(){ r.result.createObjectStore(STORE); };
      r.onsuccess=function(){ h=r.result; res(h); };
      r.onerror=function(){ res(null); };
    });
  }
  function tx(mode,fn){
    return open().then(function(d){
      if(!d) throw 0;
      return new Promise(function(res,rej){
        var t=d.transaction(STORE,mode), s=t.objectStore(STORE), q=fn(s);
        t.oncomplete=function(){ res(q&&q.result); };
        t.onerror=function(){ rej(t.error); };
      });
    });
  }
  return {
    get:function(k){ return tx('readonly',function(s){return s.get(k);}).catch(function(){
      try{ return JSON.parse(localStorage.getItem('pg_'+k)); }catch(e){ return null; }
    }); },
    set:function(k,v){ return tx('readwrite',function(s){return s.put(v,k);}).catch(function(){
      try{ localStorage.setItem('pg_'+k, JSON.stringify(v)); }catch(e){}
    }); }
  };
})();

/* =======================================================================
   RED
   Invidious primero: sí manda Access-Control-Allow-Origin.
   Piped como respaldo. Presupuesto global para no colgarse.
   ======================================================================= */

  function(u){ return 'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(u); },
  function(u){ return 'https://api.allorigins.win/raw?url='+encodeURIComponent(u); }
];
var dead={}, lastInv=null;

function j(url,ms){
  var c=new AbortController(), t=setTimeout(function(){c.abort();},ms||4500);
  return fetch(url,{signal:c.signal,headers:{'Accept':'application/json'}})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .finally(function(){ clearTimeout(t); });
}

function walk(urls,ms){
  var i=0;
  return new Promise(function(res,rej){
    (function step(){
      if(i>=urls.length) return rej(new Error('agotado'));
      var u=urls[i++];
      if(dead[u]) return step();
      j(u,ms).then(function(d){
        var host=(u.match(/^https?:\/\/[^/]+/)||[])[0];
        if(host && INV.indexOf(host)>-1) lastInv=host;
        res(d);
      }).catch(function(){
        dead[u]=1; setTimeout(function(){ delete dead[u]; },120000); step();
      });
    })();
  });
}

// directo en todas las instancias; luego, solo si hace falta, vía proxy
function pool(list,path,ms){
  var direct=list.map(function(b){ return b+path; });
  return walk(direct,ms).catch(function(){
    var prox=[];
    PROXIES.forEach(function(w){ list.slice(0,2).forEach(function(b){ prox.push(w(b+path)); }); });
    return walk(prox,9000);
  });
}

function budget(p,ms){
  return Promise.race([p,new Promise(function(_,rej){
    setTimeout(function(){ rej(new Error('tiempo agotado')); },ms);
  })]);
}

/* =======================================================================
   NORMALIZADOR
   ======================================================================= */
function norm(it){
  if(!it) return null;
  var raw=it.url||'';
  var m=raw.match(/[?&]v=([\w-]{11})/) || raw.match(/\/([\w-]{11})$/);
  var id=it.videoId||(m?m[1]:'');
  if(!id||id.length!==11) return null;
  var th=it.thumbnail||(it.thumbnails&&it.thumbnails[0]&&it.thumbnails[0].url)
        ||(it.videoThumbnails&&it.videoThumbnails[0]&&it.videoThumbnails[0].url)
        ||('https://i.ytimg.com/vi/'+id+'/mqdefault.jpg');
  var up=it.uploaderName||it.uploader||it.author||'';
  return {
    id:id,
    title:it.title||'Sin título',
    artist:String(up).replace(/ - Topic$/,''),
    artistId:String(it.uploaderUrl||it.authorId||'').replace('/channel/',''),
    dur:it.duration||it.lengthSeconds||0,
    thumb:th
  };
}

    var e=encodeURIComponent(q);
    return pool(INV,'/api/v1/search?q='+e+'&type=video',4500)
      .then(function(d){ return (Array.isArray(d)?d:[]).map(norm).filter(Boolean); })
      .then(function(r){ if(r.length) return r; throw 0; })
      .catch(function(){
        return pool(PIPED,'/search?q='+e+'&filter=music_songs',4000)
          .then(function(d){ return (d.items||[]).map(norm).filter(Boolean); })
          .then(function(r){ if(r.length) return r; throw 0; })
          .catch(function(){
            return pool(INV,'/api/v1/search?q='+e+'&type=all',5000)
              .then(function(d){ return (Array.isArray(d)?d:[]).map(norm).filter(Boolean); });
          });
      });
  },
  trending:function(){
    return pool(INV,'/api/v1/trending?region=US&type=music',4500)
      .then(function(d){ return (Array.isArray(d)?d:[]).map(norm).filter(Boolean); })
      .then(function(r){ if(r.length) return r; throw 0; })
      .catch(function(){
        return pool(PIPED,'/trending?region=US',4000)
          .then(function(d){ return (Array.isArray(d)?d:[]).map(norm).filter(Boolean); });
      });
  },
  audio:function(id){
    var chain=[];
    if(lastInv) chain.push(function(){ return Promise.resolve({url:lastInv+'/latest_version?id='+id+'&itag=140'}); });
    chain.push(function(){
      return pool(INV,'/api/v1/videos/'+id,5000).then(function(d){
        var a=(d.adaptiveFormats||[]).filter(function(f){ return /audio/.test(f.type||''); })
          .sort(function(x,y){ return (y.bitrate||0)-(x.bitrate||0); })[0];
        if(!a||!a.url) throw 0;
        return {url:a.url};
      });
    });
    chain.push(function(){
      return pool(PIPED,'/streams/'+id,5000).then(function(d){
        var a=(d.audioStreams||[]).sort(function(x,y){ return (y.bitrate||0)-(x.bitrate||0); })[0];
        if(!a) throw 0;
        return {url:a.url};
      });
    });
    return chain.reduce(function(p,f){ return p.catch(f); }, Promise.reject());
  },
  channel:function(id){
    return pool(INV,'/api/v1/channels/'+id,5000).then(function(d){
      return {
        name:d.author,
        thumb:(d.authorThumbnails&&d.authorThumbnails[0]&&d.authorThumbnails[0].url)||'',
        desc:d.description||'',
        items:(d.latestVideos||[]).map(norm).filter(Boolean)
      };
    }).catch(function(){
      return pool(PIPED,'/channel/'+id,5000).then(function(d){
        return { name:d.name, thumb:d.avatarUrl, desc:d.description||'',
          items:(d.relatedStreams||[]).map(norm).filter(Boolean) };
      });
    });
  },
  album:function(id){
    return pool(INV,'/api/v1/playlists/'+id,5000).then(function(d){
      return { name:d.title, thumb:d.playlistThumbnail, owner:d.author||'',
        items:(d.videos||[]).map(norm).filter(Boolean) };
    }).catch(function(){
      return pool(PIPED,'/playlists/'+id,5000).then(function(d){
        return { name:d.name, thumb:d.thumbnailUrl, owner:d.uploader||'',
          items:(d.relatedStreams||[]).map(norm).filter(Boolean) };
      });
    });
  }
};

/* =======================================================================
   ESTADO
   ======================================================================= */
var view=$('#view'), audio=new Audio(), emb=$('#emb');
var S={queue:[],qi:-1,shuffle:false,repeat:'off',vol:85,likes:[],lists:[],hist:[],tab:'songs',online:null,embed:false,playing:false,cur:null};
var navToken=0;
function alive(t){ return t===navToken; }

audio.volume=S.vol/100;
function save(){
  db.set('state',{queue:S.queue,qi:S.qi,shuffle:S.shuffle,repeat:S.repeat,vol:S.vol});
  db.set('likes',S.likes); db.set('lists',S.lists); db.set('hist',S.hist.slice(0,80));
}
function toast(t){var el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove('show');},1800);}
function fmt(s){s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

/* =======================================================================
   MOTOR
   ======================================================================= */
function embedPlay(id){
  $('#vid').style.display='block';
  emb.src='https://www.youtube.com/embed/'+id+'?autoplay=1&enablejsapi=1&rel=0';
}
function playTrack(t){
  if(!t) return;
  S.cur=t;
  S.hist.unshift({id:t.id,title:t.title,artist:t.artist,thumb:t.thumb,dur:t.dur,ts:Date.now()});
  S.hist=S.hist.slice(0,80);
  paintNow(); renderQueue(); save();
  if(S.online===false) return embedPlay(t.id);
  audio.pause(); audio.src='';
  api.audio(t.id).then(function(r){
    audio.src=r.url;
    audio.play().catch(function(){ toast('Pulsa play para iniciar'); });
  }).catch(function(){ embedPlay(t.id); toast('Sin audio directo, modo incrustado'); });
}
function playQueue(i){
  if(i<0||i>=S.queue.length) return;
  S.qi=i; playTrack(S.queue[i]);
}
function next(){
  if(S.repeat==='one'&&S.cur){ audio.currentTime=0; audio.play(); return; }
  if(S.shuffle&&S.queue.length>1){var r;do{r=Math.floor(Math.random()*S.queue.length);}while(r===S.qi);return playQueue(r);}
  if(S.qi+1<S.queue.length) return playQueue(S.qi+1);
  if(S.repeat==='all'&&S.queue.length) return playQueue(0);
  S.playing=false; paintPlay();
}
function prev(){ if(audio.currentTime>4){audio.currentTime=0;return;} if(S.qi>0) playQueue(S.qi-1); }

audio.addEventListener('timeupdate',function(){
  var d=audio.duration||0;
  $('#fill').style.width=(d?Math.min(100,audio.currentTime/d*100):0)+'%';
  $('#tCur').textContent=fmt(audio.currentTime);
  if(d&&d<1e5) $('#tDur').textContent=fmt(d);
});
audio.addEventListener('ended',next);
audio.addEventListener('play',function(){S.playing=true;paintPlay();});
audio.addEventListener('pause',function(){S.playing=false;paintPlay();});

function paintPlay(){
  $('#pPlay').innerHTML = S.playing
    ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>'
    : '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
}
function paintNow(){
  var t=S.cur;
  $('#pArt').innerHTML = t?'<img src="'+esc(t.thumb)+'" alt="">':'';
  $('#pTitle').textContent = t?t.title:'Nada sonando';
  $('#pSub').textContent = t?(t.artist||'—'):'—';
  $('#pLike').classList.toggle('on', !!(t&&S.likes.some(function(x){return x.id===t.id;})));
  $('#tDur').textContent = t?fmt(t.dur):'0:00';
  if(navigator.mediaSession&&t){
    try{ navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist,artwork:[{src:t.thumb}]}); }catch(e){}
  }
}

/* =======================================================================
   COMPONENTES
   ======================================================================= */
function card(t,round){
  return '<div class="card'+(round?' round':'')+'" data-play="'+esc(t.id)+'"><div class="art"><img loading="lazy" src="'+esc(t.thumb)+'" alt=""><div class="pv"><b><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></b></div></div><div class="tt">'+esc(t.title)+'</div><div class="sb">'+esc(t.artist||'')+'</div></div>';
}
function trackRow(t,i){
  var on = S.cur && S.cur.id===t.id;
  var art = t.artistId
    ? '<a href="#/artist/'+esc(t.artistId)+'" onclick="event.stopPropagation()">'+esc(t.artist)+'</a>'
    : esc(t.artist||'');
  return '<div class="tr'+(on?' on':'')+'" data-i="'+i+'"><div class="n">'+(on?'♪':i+1)+'</div>'+
    '<div class="th"><img loading="lazy" src="'+esc(t.thumb)+'" alt=""></div>'+
    '<div><div class="t1">'+esc(t.title)+'</div><div class="t2">'+art+'</div></div>'+
    '<button class="add" data-add="'+i+'" title="Añadir a lista"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg></button>'+
    '<div class="d">'+(t.dur?fmt(t.dur):'')+'</div></div>';
}
function skeleton(n){var o='';for(var i=0;i<n;i++)o+='<div class="card"><div class="sk" style="width:146px;height:146px"></div><div class="sk" style="width:90%;height:11px;margin-top:9px"></div></div>';return '<div class="cards">'+o+'</div>';}

function wireList(container,list){
  if(!container) return;
  $$('.tr',container).forEach(function(r){
    r.onclick=function(e){ if(e.target.closest('.add')) return; S.queue=list.slice(); playQueue(+r.dataset.i); };
  });
  $$('.add',container).forEach(function(b){
    b.onclick=function(e){ e.stopPropagation(); addToPlaylist(list[+b.dataset.add]); };
  });
  $$('.card',container).forEach(function(c){
    c.onclick=function(){
      var t=list.filter(function(x){return x.id===c.dataset.play;})[0];
      if(t){ S.queue=[t]; playQueue(0); }
    };
  });
}
function retryBox(){ return '<div class="note">No se pudo conectar con ningún servidor.<button class="btn o" data-retry style="padding:5px 12px;font-size:11px">Reintentar</button></div>'; }
function wireRetry(){ $$('[data-retry]').forEach(function(b){ b.onclick=retry; }); }

/* =======================================================================
   VISTAS
   ======================================================================= */
function vHome(){
  var tok=navToken;
  view.innerHTML='<div class="hrow"><h1>Buenas noches</h1></div><div class="chips" id="genres"></div><div id="feed">'+skeleton(5)+'</div>';
  ['Éxitos','Lo-fi','Rock','Pop latino','Jazz','Electrónica','Clásica','Hip hop'].forEach(function(g){
    var c=document.createElement('div'); c.className='chip'; c.textContent=g;
    c.onclick=function(){ location.hash='#/search?q='+encodeURIComponent(g); };
    $('#genres').appendChild(c);
  });
  if(S.online===false){ $('#feed').innerHTML=retryBox(); wireRetry(); return; }
  budget(api.trending(),16000).then(function(list){
    if(!alive(tok)) return;
    if(!list.length) throw 0;
    var h='';
    if(S.hist.length) h+='<div class="shelf"><div class="hrow"><h2>Escuchado hace poco</h2></div><div class="cards">'+S.hist.slice(0,12).map(function(x){return card(x);}).join('')+'</div></div>';
    h+='<div class="shelf"><div class="hrow"><h2>Tendencias</h2></div><div class="cards">'+list.slice(0,14).map(function(x){return card(x);}).join('')+'</div></div>';
    $('#feed').innerHTML=h;
    wireList($('#feed'),S.hist.concat(list));
  }).catch(function(){
    if(!alive(tok)) return;
    $('#feed').innerHTML=retryBox(); wireRetry();
  });
}

function vSearch(q){
  var tok=navToken;
  view.innerHTML='<div class="hrow"><h2>Resultados para «'+esc(q)+'»</h2></div><div id="res">'+skeleton(4)+'</div>';
  if(S.online===false){ $('#res').innerHTML=retryBox(); wireRetry(); return; }
  budget(api.search(q),16000).then(function(list){
    if(!alive(tok)) return;
    if(!list.length){ $('#res').innerHTML='<div class="note">Sin resultados para «'+esc(q)+'».</div>'; return; }
    $('#res').innerHTML='<div class="actions"><button class="btn" id="all">Reproducir todo</button></div><div class="tracklist">'+list.map(trackRow).join('')+'</div>';

    if(!alive(tok)) return;
    $('#res').innerHTML=retryBox(); wireRetry();
  });
}

function vLibrary(){
  view.innerHTML='<div class="hrow"><h1>Biblioteca</h1></div>';

  if(S.hist.length) h+='<div class="shelf"><div class="hrow"><h2>Historial</h2></div><div class="cards">'+S.hist.slice(0,20).map(function(t){return card(t);}).join('')+'</div></div>';

    (L.items.length?'<div class="tracklist">'+L.items.map(trackRow).join('')+'</div>':'<div class="note">Lista vacía.</div>');
  $('#all').onclick=function(){ S.queue=L.items.slice(); playQueue(0); };

/* =======================================================================
   LISTAS Y ROUTER
   ======================================================================= */
function addToPlaylist(track){
  if(!track) return;
  if(!S.lists.length) S.lists.push({id:'l'+Date.now(),name:'Mi lista',items:[]});
  S.lists[0].items.push(track);
  save(); renderSide();
  toast('Añadido a «'+S.lists[0].name+'»');
}
function renderSide(){
  var c=$('#sideLists'); if(!c) return;
  c.innerHTML=S.lists.map(function(L){
    return '<div class="plrow" data-pl="'+L.id+'"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h10"/></svg><span>'+esc(L.name)+'</span></div>';
  }).join('');
  $$('[data-pl]',c).forEach(function(r){ r.onclick=function(){ location.hash='#/playlist/'+r.dataset.pl; }; });
}

function route(){
  navToken++;
  var h=location.hash||'#/', m;
  $$('.nav').forEach(function(n){ n.classList.toggle('on', n.dataset.go===h); });
  if(h==='#/'||h==='') return vHome();
  if(h==='#/library') return vLibrary();
  if(h==='#/explore') return vExplore();
  if((m=h.match(/^#\/search\?q=(.*)$/))) return vSearch(decodeURIComponent(m[1]));
  if((m=h.match(/^#\/artist\/(.+)$/))) return vArtist(m[1]);
  if((m=h.match(/^#\/album\/(.+)$/))) return vAlbum(m[1]);
  if((m=h.match(/^#\/playlist\/(.+)$/))) return vPlaylist(m[1]);
  vHome();
}
window.addEventListener('hashchange',route);

function renderQueue(){
  var q=$('#qlist'); if(!q) return;
  if(!S.queue.length){ q.innerHTML='<div class="note">Cola vacía.</div>'; return; }
  q.innerHTML=S.queue.map(function(t,i){
    return '<div class="tr'+(i===S.qi?' on':'')+'" data-q="'+i+'"><div class="n">'+(i===S.qi?'♪':i+1)+'</div><div class="th"><img src="'+esc(t.thumb)+'"></div><div><div class="t1">'+esc(t.title)+'</div><div class="t2">'+esc(t.artist)+'</div></div><div class="d">'+fmt(t.dur)+'</div></div>';
  }).join('');
  $$('[data-q]',q).forEach(function(r){ r.onclick=function(){ playQueue(+r.dataset.q); }; });
}

  b.style.borderColor=S.online?'var(--acc)':'var(--line2)';
}

function retry(){
  S.online=null; dead={}; lastInv=null;
  $('#vid').style.display='none'; emb.src='about:blank';
  setBadge(); route();
  budget(api.trending(),14000)
    .then(function(){ S.online=true; })
    .catch(function(){ S.online=false; })
    .finally(function(){ setBadge(); if(!location.hash||location.hash==='#/') route(); });
}

Promise.all([db.get('state'),db.get('likes'),db.get('lists'),db.get('hist')]).then(function(r){
  var st=r[0]||{};
  ['queue','qi','shuffle','repeat','vol'].forEach(function(k){ if(st[k]!==undefined) S[k]=st[k]; });
